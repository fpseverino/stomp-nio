name: CI

on:
   push:
     branches:
     - main
   pull_request:
     branches:
     - main
   release:
     types: [published]
   workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: true

jobs:
  linux-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        tag:
          - swift:6.2
    container:
      image: ${{ matrix.tag }}
    services:
      rabbitmq:
        image: rabbitmq:4.2.1
        options: --hostname rabbitmq --name rabbitmq
        ports:
          - 61613:61613
        volumes:
          - ${{ github.workspace }}/RabbitMQ/enabled_plugins:/etc/rabbitmq
          - ${{ github.workspace }}/RabbitMQ/config:/etc/rabbitmq
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Restart RabbitMQ
      uses: docker://docker
      with:
        args: docker restart rabbitmq
    - name: Test
      env:
        RABBITMQ_SERVER: rabbitmq
      run: swift test

  lint:
    runs-on: ubuntu-latest
    container: swift:noble
    timeout-minutes: 5
    steps:
      - name: Configure git
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"
      - name: Check out code
        uses: actions/checkout@v6
      - name: Lint
        run: |
          apt -q update && apt -yq install curl
          curl -s https://raw.githubusercontent.com/swiftlang/github-workflows/refs/heads/main/.github/workflows/scripts/check-swift-format.sh | bash